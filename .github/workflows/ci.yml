name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs of the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (1.25.3) and latest currently-supported major (1.26.x).
        # 1.24 and 1.23 are out of Go's two-newest-major support window.
        go: ["1.25.3", "1.26.x"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod
          # go.sum is created on demand; if it doesn't exist there are no deps to verify
          if [ -f go.sum ]; then git diff --exit-code go.sum; fi

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate (per-package)
        run: ./scripts/coverage-check.sh

      - name: Upload coverage artifact
        if: matrix.go == '1.25.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: golangci-lint
        # @v8 is the action release line that supports golangci-lint v2.x.
        # The .golangci.yml in this repo uses the v2 config schema, so v2 is
        # required. Also: golangci-lint v1.x is built with Go 1.24 and refuses
        # to lint modules declaring go 1.25+ (the floor here is 1.25.3).
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          args: --timeout=5m
